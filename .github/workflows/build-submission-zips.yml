name: Build submission zips

on:
  push:
    branches: [packaging-20260928]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Checkpoint 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          git archive --format=zip --output=out/Himanshu_Sahoo_25065059_Checkpoint2.zip HEAD

      - name: Build Checkpoint 3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          git archive --format=zip --output=out/Himanshu_Sahoo_Checkpoint3.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: PREPATHON-submission-zips
          path: out/*.zip
          retention-days: 7
